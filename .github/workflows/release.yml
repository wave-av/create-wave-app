name: release

# Publishes @wave-av/create-app to npm when a `v*` tag is pushed.
#
# Auth is npm trusted publishing (OIDC): no long-lived npm token. It needs a
# Trusted Publisher for @wave-av/create-app on npmjs.com pointing at this
# repository and this workflow file. --provenance adds a signed statement that
# links the published tarball to this repository and commit.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # the OIDC token npm exchanges for a one-time publish credential
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1. Pinned: this job can publish.
      - run: npm install -g npm@11.5.1 && npm --version
      - run: npm ci
      # The tag comes from the environment, never interpolated into the script.
      - name: Tag must match package.json version
        id: ver
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${TAG_NAME#v}" != "$PKG_VERSION" ]; then
            echo "::error::tag $TAG_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          case "$PKG_VERSION" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: npm publish (trusted publishing, with provenance)
        env:
          DIST_TAG: ${{ steps.ver.outputs.dist_tag }}
        run: npm publish --access public --provenance --tag "$DIST_TAG"
