name: test

on:
  pull_request:
  push:
    branches: [main]
  # release.yml calls this with require-adk: true, so a release cannot skip a template.
  workflow_call:
    inputs:
      require-adk:
        description: Fail, instead of warning, when a template's @wave-av/adk range is not on npm.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - name: Help text names the scoped package
        run: |
          set -euo pipefail
          node dist/index.js --help | tee help.txt
          grep -q 'npx @wave-av/create-app' help.txt
          if grep -q 'npx create-wave-app' help.txt; then echo "::error::help text names the unscoped package"; exit 1; fi

  # Packs the real tarball, scaffolds every template from it with npx, then
  # installs, type-checks and builds each one in a clean directory.
  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack and scaffold every template
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          for t in stream-monitor mastra-agent livekit-agent webhook-handler nextjs-supabase; do
            npx --yes --package "$RUNNER_TEMP"/wave-av-create-app-*.tgz create-wave-app "app-$t" --template "$t"
            test -f "app-$t/.gitignore"
          done
      - name: Install, type-check and build each template
        env:
          # Pull requests may land before the ADK release they need; a release may not.
          REQUIRE_ADK: ${{ inputs.require-adk && '1' || '0' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          adk_ready="$(npm view '@wave-av/adk@^1.1.0' version 2>/dev/null | tail -1 || true)"
          for t in stream-monitor mastra-agent livekit-agent webhook-handler nextjs-supabase; do
            if grep -q '"@wave-av/adk"' "app-$t/package.json" && [ -z "$adk_ready" ]; then
              if [ "$REQUIRE_ADK" = "1" ]; then
                echo "::error title=ADK not published::$t needs @wave-av/adk ^1.1.0, which is not on npm. Publish the ADK first."
                exit 1
              fi
              echo "::warning title=Template not installed::$t needs @wave-av/adk ^1.1.0, which is not on npm yet. It was scaffolded and statically checked only."
              continue
            fi
            echo "::group::$t"
            (cd "app-$t" && npm install --no-audit --no-fund && npm run type-check && if npm run | grep -q '^  build$'; then npm run build; fi)
            echo "::endgroup::"
          done
      - name: webhook-handler signature tests
        run: cd "$RUNNER_TEMP/app-webhook-handler" && npm test
